<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔊 Painel de Sons Malucos TURBO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    padding: 8px;
    user-select: none;
    overflow-x: hidden;
  }
  h1 {
    color: #fff;
    text-align: center;
    font-size: 1.3rem;
    margin: 8px 0;
    text-shadow: 0 0 15px #ff00ff, 0 0 25px #ff00ff;
  }
  .volume-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 10px auto;
    max-width: 400px;
    color: #fff;
    font-size: 0.9rem;
  }
  .volume-bar input {
    flex: 1;
    max-width: 200px;
    accent-color: #ff00ff;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
    gap: 6px;
    max-width: 500px;
    margin: 0 auto;
  }
  button {
    aspect-ratio: 1;
    border: none;
    border-radius: 12px;
    font-size: 1.8rem;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 0 15px rgba(255,255,255,0.1);
    color: white;
    font-weight: bold;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  }
  button:active {
    transform: translateY(3px) scale(0.95);
    box-shadow: 0 1px 0 rgba(0,0,0,0.3);
  }
  button.pulse {
    animation: pulse 0.6s ease-out;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); box-shadow: 0 0 35px currentColor; }
    100% { transform: scale(1); }
  }
  .label {
    position: absolute;
    bottom: 2px;
    left: 0;
    right: 0;
    font-size: 0.55rem;
    text-align: center;
    opacity: 0.9;
  }
  .c1 { background: linear-gradient(135deg, #ff6b6b, #ee5a6f); }
  .c2 { background: linear-gradient(135deg, #feca57, #ff9f43); }
  .c3 { background: linear-gradient(135deg, #48dbfb, #0abde3); }
  .c4 { background: linear-gradient(135deg, #1dd1a1, #10ac84); }
  .c5 { background: linear-gradient(135deg, #ff9ff3, #f368e0); }
  .c6 { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
  .c7 { background: linear-gradient(135deg, #fd79a8, #e84393); }
  .c8 { background: linear-gradient(135deg, #55efc4, #00b894); }
  .c9 { background: linear-gradient(135deg, #fdcb6e, #e17055); }
  .c10 { background: linear-gradient(135deg, #74b9ff, #0984e3); }
</style>
</head>
<body>

<h1>🔊 SONS MALUCOS TURBO 🔊</h1>
<div class="volume-bar">
  <span>🔈</span>
  <input type="range" id="volSlider" min="0" max="200" value="100">
  <span id="volLabel">100%</span>
  <span>🔊</span>
</div>
<div class="grid" id="grid"></div>

<script>
// ====== CONTEXTO DE ÁUDIO COM COMPRESSOR MASTER ======
let ctx, masterGain, compressor;
function getCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Compressor evita distorção mesmo no volume alto
    compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -12;
    compressor.knee.value = 10;
    compressor.ratio.value = 4;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.25;
    // Master Gain
    masterGain = ctx.createGain();
    masterGain.gain.value = 1.0;
    masterGain.connect(compressor);
    compressor.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function getOut() {
  getCtx();
  return masterGain;
}

// Controle de volume
const volSlider = document.getElementById('volSlider');
const volLabel = document.getElementById('volLabel');
volSlider.addEventListener('input', () => {
  const v = volSlider.value / 100;
  if (masterGain) masterGain.gain.value = v;
  volLabel.textContent = volSlider.value + '%';
});

// ====== DEFINIÇÃO DOS SONS ======
const sounds = [
  { emoji: '🎺', name: 'Trombone', fn: trombone },
  { emoji: '💥', name: 'BOOM', fn: boom },
  { emoji: '🤡', name: 'Boing', fn: boing },
  { emoji: '👽', name: 'Alien', fn: alien },
  { emoji: '💨', name: 'Pum', fn: pum },
  { emoji: '🔫', name: 'Laser', fn: laser },
  { emoji: '🐸', name: 'Croac', fn: croac },
  { emoji: '🤖', name: 'Robô', fn: robot },
  { emoji: '🎪', name: 'Palhaço', fn: palhaco },
  { emoji: '🐔', name: 'Frango', fn: frango },
  { emoji: '🔔', name: 'Sino', fn: sino },
  { emoji: '🌀', name: 'Wobble', fn: wobble },
  { emoji: '🎈', name: 'Balão', fn: balao },
  { emoji: '⚡', name: 'Zap', fn: zap },
  { emoji: '🐭', name: 'Squeak', fn: squeak },
  { emoji: '🎵', name: 'Beep', fn: beep },
  { emoji: '🦆', name: 'Quack', fn: quack },
  { emoji: '🎸', name: 'Slide', fn: slide },
  { emoji: '🌊', name: 'Bolha', fn: bolha },
  { emoji: '🚨', name: 'Sirene', fn: sirene },
  { emoji: '🎲', name: 'Glitch', fn: glitch },
  { emoji: '🐝', name: 'Buzz', fn: buzz },
  { emoji: '🎹', name: 'Ding', fn: ding },
  { emoji: '🦖', name: 'Rugido', fn: rugido },
  { emoji: '🪀', name: 'Spring', fn: spring },
  { emoji: '🍳', name: 'Fritura', fn: fritura },
  { emoji: '🎭', name: 'Risada', fn: risada },
  { emoji: '🌟', name: 'Pop', fn: pop },
  { emoji: '🪗', name: 'Acordeon', fn: acordeon },
  { emoji: '🎃', name: 'Assombro', fn: assombro },
];

// ====== FUNÇÕES DE SONS (TURBO: +volume, +duração) ======
function osc(type, freq, dur, gain=0.7) {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(gain, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
  o.connect(g); g.connect(getOut());
  o.start(); o.stop(c.currentTime + dur);
}

function trombone() {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(300, c.currentTime);
  o.frequency.setValueAtTime(280, c.currentTime + 0.3);
  o.frequency.setValueAtTime(250, c.currentTime + 0.6);
  o.frequency.setValueAtTime(200, c.currentTime + 1.0);
  g.gain.setValueAtTime(0.6, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 1.4);
  o.connect(g); g.connect(getOut());
  o.start(); o.stop(c.currentTime + 1.4);
}

function boom() {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(20, c.currentTime + 1.0);
  g.gain.setValueAtTime(1.0, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 1.2);
  o.connect(g); g.connect(getOut());
  o.start(); o.stop(c.currentTime + 1.2);
  // Ruído adicional
  const bufferSize = c.sampleRate * 1.0;
  const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
  const src = c.createBufferSource();
  const filt = c.createBiquadFilter();
  const g2 = c.createGain();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(500, c.currentTime);
  filt.frequency.exponentialRampToValueAtTime(50, c.currentTime + 1.0);
  g2.gain.value = 0.7;
  src.buffer = buffer;
  src.connect(filt); filt.connect(g2); g2.connect(getOut());
  src.start();
}

function boing() {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(80, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(1200, c.currentTime + 0.1);
  o.frequency.exponentialRampToValueAtTime(300, c.currentTime + 0.8);
  g.gain.setValueAtTime(0.7, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 1.0);
  o.connect(g); g.connect(getOut());
  o.start(); o.stop(c.currentTime + 1.0);
}

function alien() {
  const c = getCtx();
  for (let i = 0; i < 8; i++) {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'square';
    const t = c.currentTime + i * 0.15;
    o.frequency.setValueAtTime(400 + i * 150, t);
    o.frequency.exponentialRampToValueAtTime(150, t + 0.15);
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.connect(g); g.connect(getOut());
    o.start(t); o.stop(t + 0.15);
  }
}

function pum() {
  const c = getCtx();
  const bufferSize = c.sampleRate * 1.2;
  const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.4));
  const src = c.createBufferSource();
  const filt = c.createBiquadFilter();
  const g = c.createGain();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(300, c.currentTime);
  filt.frequency.linearRampToValueAtTime(60, c.currentTime + 1.2);
  g.gain.value = 1.0;
  src.buffer = buffer;
  src.connect(filt); filt.connect(g); g.connect(getOut());
  src.start();
}

function laser() {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(2000, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(80, c.currentTime + 0.6);
  g.gain.setValueAtTime(0.5, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.7);
  o.connect(g); g.connect(getOut());
  o.start(); o.stop(c.currentTime + 0.7);
}

function croac() {
  const c = getCtx();
  for (let i = 0; i < 4; i++) {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sawtooth';
    const t = c.currentTime + i * 0.25;
    o.frequency.setValueAtTime(180, t);
    o.frequency.linearRampToValueAtTime(70, t + 0.2);
    g.gain.setValueAtTime(0.7, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g); g.connect(getOut());
    o.start(t); o.stop(t + 0.22);
  }
}

function robot() {
  const c = getCtx();
  const o = c.createOscillator();
  const mod = c.createOscillator();
  const modG = c.createGain();
  const g = c.createGain();
  o.type = 'square'; o.frequency.value = 100;
  mod.type = 'square'; mod.frequency.value = 30;
  modG.gain.value = 80;
  mod.connect(modG); modG.connect(o.frequency);
  g.gain.setValueAtTime(0.5, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 1.2);
  o.connect(g); g.connect(getOut());
  o.start(); mod.start();
  o.stop(c.currentTime + 1.2); mod.stop(c.currentTime + 1.2);
}

function palhaco() {
  const c = getCtx();
  const notas = [523, 659, 784, 659, 523, 659, 784, 1046];
  notas.forEach((f, i) => {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'triangle';
    o.frequency.value = f;
    const t = c.currentTime + i * 0.18;
    g.gain.setValueAtTime(0.6, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); g.connect(getOut());
    o.start(t); o.stop(t + 0.18);
  });
}

function frango() {
  const c = getCtx();
  for (let i = 0; i < 6; i++) {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sawtooth';
    const t = c.currentTime + i * 0.15;
    o.frequency.setValueAtTime(900 + Math.random() * 500, t);
    o.frequency.exponentialRampToValueAtTime(400, t + 0.12);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); g.connect(getOut());
    o.start(t); o.stop(t + 0.12);
  }
}

function sino() {
  const c = getCtx();
  [523, 659, 784, 1046, 1318].forEach((f, i) => {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0.5 / (i + 1), c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 3.0);
    o.connect(g); g.connect(getOut());
    o.start(); o.stop(c.currentTime + 3.0);
  });
}

function wobble() {
  const c = getCtx();
  const o = c.createOscillator();
  const mod = c.createOscillator();
  const modG = c.createGain();
  const g = c.createGain();
  o.type = 'sawtooth'; o.frequency.value = 200;
  mod.type = 'sine'; mod.frequency.value = 8;
  modG.gain.value = 150;
  mod.connect(modG); modG.connect(o.frequency);
  g.gain.setValueAtTime(0.5, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 1.5);
  o.connect(g); g.connect(getOut());
  o.start(); mod.start();
  o.stop(c.currentTime + 1.5); mod.stop(c.currentTime + 1.5);
}

function balao() {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(2500, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(40, c.currentTime + 0.8);
  g.gain.setValueAtTime(0.7, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.9);
  o.connect(g); g.connect(getOut());
  o.start(); o.stop(c.currentTime + 0.9);
}

function zap() {
  const c = getCtx();
  const bufferSize = c.sampleRate * 0.6;
  const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
  const src = c.createBufferSource();
  const filt = c.createBiquadFilter();
  const g = c.createGain();
  filt.type = 'highpass'; filt.frequency.value = 1500;
  g.gain.value = 0.8;
  src.buffer = buffer;
  src.connect(filt); filt.connect(g); g.connect(getOut());
  src.start();
}

function squeak() {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(1200, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(3000, c.currentTime + 0.3);
  g.gain.setValueAtTime(0.5, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.4);
  o.connect(g); g.connect(getOut());
  o.start(); o.stop(c.currentTime + 0.4);
}

function beep() { osc('square', 880, 0.6, 0.5); }

function quack() {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  const filt = c.createBiquadFilter();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(450, c.currentTime);
  o.frequency.linearRampToValueAtTime(180, c.currentTime + 0.4);
  filt.type = 'bandpass'; filt.frequency.value = 900; filt.Q.value = 6;
  g.gain.setValueAtTime(0.7, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.5);
  o.connect(filt); filt.connect(g); g.connect(getOut());
  o.start(); o.stop(c.currentTime + 0.5);
}

function slide() {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(150, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(1800, c.currentTime + 0.8);
  g.gain.setValueAtTime(0.6, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.9);
  o.connect(g); g.connect(getOut());
  o.start(); o.stop(c.currentTime + 0.9);
}

function bolha() {
  const c = getCtx();
  for (let i = 0; i < 8; i++) {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine';
    const t = c.currentTime + i * 0.12;
    o.frequency.setValueAtTime(300, t);
    o.frequency.exponentialRampToValueAtTime(1000, t + 0.1);
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); g.connect(getOut());
    o.start(t); o.stop(t + 0.12);
  }
}

function sirene() {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(400, c.currentTime);
  o.frequency.linearRampToValueAtTime(1000, c.currentTime + 0.6);
  o.frequency.linearRampToValueAtTime(400, c.currentTime + 1.2);
  o.frequency.linearRampToValueAtTime(1000, c.currentTime + 1.8);
  g.gain.setValueAtTime(0.5, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 2.0);
  o.connect(g); g.connect(getOut());
  o.start(); o.stop(c.currentTime + 2.0);
}

function glitch() {
  const c = getCtx();
  for (let i = 0; i < 14; i++) {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = ['square', 'sawtooth', 'triangle'][Math.floor(Math.random() * 3)];
    const t = c.currentTime + i * 0.07;
    o.frequency.value = 150 + Math.random() * 2500;
    g.gain.setValueAtTime(0.4, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    o.connect(g); g.connect(getOut());
    o.start(t); o.stop(t + 0.07);
  }
}

function buzz() {
  const c = getCtx();
  const o = c.createOscillator();
  const mod = c.createOscillator();
  const modG = c.createGain();
  const g = c.createGain();
  o.type = 'sawtooth'; o.frequency.value = 150;
  mod.type = 'sine'; mod.frequency.value = 50;
  modG.gain.value = 50;
  mod.connect(modG); modG.connect(o.frequency);
  g.gain.setValueAtTime(0.5, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 1.0);
  o.connect(g); g.connect(getOut());
  o.start(); mod.start();
  o.stop(c.currentTime + 1.0); mod.stop(c.currentTime + 1.0);
}

function ding() {
  const c = getCtx();
  [880, 1320, 1760, 2200].forEach((f, i) => {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.5 / (i + 1), c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 2.5);
    o.connect(g); g.connect(getOut());
    o.start(); o.stop(c.currentTime + 2.5);
  });
}

function rugido() {
  const c = getCtx();
  const bufferSize = c.sampleRate * 1.8;
  const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1);
  const src = c.createBufferSource();
  const filt = c.createBiquadFilter();
  const g = c.createGain();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(100, c.currentTime);
  filt.frequency.linearRampToValueAtTime(500, c.currentTime + 0.4);
  filt.frequency.linearRampToValueAtTime(60, c.currentTime + 1.8);
  g.gain.setValueAtTime(0.9, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 1.8);
  src.buffer = buffer;
  src.connect(filt); filt.connect(g); g.connect(getOut());
  src.start();
}

function spring() {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(80, c.currentTime);
  for (let i = 0; i < 15; i++) {
    const t = c.currentTime + i * 0.08;
    o.frequency.setValueAtTime(80 + (i % 2 === 0 ? 1200 : 80), t);
  }
  g.gain.setValueAtTime(0.6, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 1.3);
  o.connect(g); g.connect(getOut());
  o.start(); o.stop(c.currentTime + 1.3);
}

function fritura() {
  const c = getCtx();
  const bufferSize = c.sampleRate * 1.5;
  const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (Math.random() > 0.85 ? 1 : 0.15);
  }
  const src = c.createBufferSource();
  const filt = c.createBiquadFilter();
  const g = c.createGain();
  filt.type = 'highpass'; filt.frequency.value = 2500;
  g.gain.value = 0.7;
  src.buffer = buffer;
  src.connect(filt); filt.connect(g); g.connect(getOut());
  src.start();
}

function risada() {
  const c = getCtx();
  const notas = [400, 550, 400, 550, 400, 550, 400, 550, 300];
  notas.forEach((f, i) => {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = 'triangle';
    o.frequency.value = f;
    const t = c.currentTime + i * 0.18;
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    o.connect(g); g.connect(getOut());
    o.start(t); o.stop(t + 0.17);
  });
}

function pop() {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(1800, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(80, c.currentTime + 0.15);
  g.gain.setValueAtTime(0.7, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.2);
  o.connect(g); g.connect(getOut());
  o.start(); o.stop(c.currentTime + 0.2);
}

function acordeon() {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  const mod = c.createOscillator();
  const modG = c.createGain();
  o.type = 'sawtooth'; o.frequency.value = 220;
  mod.type = 'sine'; mod.frequency.value = 6;
  modG.gain.value = 0.5;
  mod.connect(modG); modG.connect(g.gain);
  g.gain.setValueAtTime(0.5, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 1.5);
  o.connect(g); g.connect(getOut());
  o.start(); mod.start();
  o.stop(c.currentTime + 1.5); mod.stop(c.currentTime + 1.5);
}

function assombro() {
  const c = getCtx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(1000, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(40, c.currentTime + 2.0);
  g.gain.setValueAtTime(0.6, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 2.2);
  o.connect(g); g.connect(getOut());
  o.start(); o.stop(c.currentTime + 2.2);
}

// ====== MONTAR BOTÕES ======
const grid = document.getElementById('grid');
sounds.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = `c${(i % 10) + 1}`;
  btn.innerHTML = `${s.emoji}<div class="label">${s.name}</div>`;
  btn.addEventListener('click', () => {
    btn.classList.remove('pulse');
    void btn.offsetWidth;
    btn.classList.add('pulse');
    try { s.fn(); } catch(e) { console.warn(e); }
  });
  grid.appendChild(btn);
});

// Desbloquear áudio no primeiro toque (iOS)
document.addEventListener('touchstart', () => getCtx(), { once: true });
document.addEventListener('click', () => getCtx(), { once: true });
</script>
