<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Som Textual e Voz</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-bg: #1e1e24;
            --accent-color: #00e676;
            --voice-color: #00b0ff;
            --text-color: #ffffff;
            --input-bg: #2a2a32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 30px;
            max-width: 620px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Abas de Modo */
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            background: var(--input-bg);
            border: 2px solid #444;
            color: #ccc;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active-synth {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .mode-btn.active-voice {
            background: var(--voice-color);
            color: #000;
            border-color: var(--voice-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #ccc;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: var(--input-bg);
            border: 2px solid #444;
            border-radius: 10px;
            color: #fff;
            padding: 12px;
            font-size: 1.1rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (max-width: 500px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-item span {
            font-size: 0.8rem;
            color: var(--accent-color);
            text-align: right;
        }

        select, input[type="range"] {
            width: 100%;
            background: var(--input-bg);
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 6px;
            outline: none;
        }

        input[type="range"] {
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .btn-play {
            width: 100%;
            padding: 15px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
        }

        .btn-play:hover {
            filter: brightness(1.1);
        }

        .btn-play:active {
            transform: scale(0.98);
        }

        /* Visualizador Gráfico */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 4px;
            height: 35px;
            margin-top: 20px;
        }

        .bar {
            width: 8px;
            height: 10%;
            background: var(--accent-color);
            border-radius: 4px;
            transition: height 0.05s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🗣️ Simulador de Som & Voz</h1>

    <!-- Alternador entre Voz Humana e Efeitos Sintetizados -->
    <div class="mode-selector">
        <button class="mode-btn active-voice" id="btnModeVoice" onclick="setMode('voice')">🎙️ Voz Humanizada</button>
        <button class="mode-btn" id="btnModeSynth" onclick="setMode('synth')">🎛️ Efeitos / Sintetizador</button>
    </div>

    <div class="input-group">
        <label for="textInput">Texto Sonoro:</label>
        <textarea id="textInput" placeholder="Digite aqui...">taca taca taca boom tss</textarea>
    </div>

    <!-- Controles Dinâmicos -->
    <div class="controls-grid">
        <!-- Seleção de Voz / Tipo de Som -->
        <div class="control-item" id="voiceSelectGroup">
            <label for="voiceList">Voz Humana Disponível:</label>
            <select id="voiceList"></select>
        </div>

        <div class="control-item" id="synthWaveGroup" style="display: none;">
            <label for="waveType">Tipo de Som (Onda):</label>
            <select id="waveType">
                <option value="square">Quadrada (Retro / 8-bit)</option>
                <option value="sawtooth">Dentada (Tecno)</option>
                <option value="sine">Senoide (Suave)</option>
                <option value="triangle">Triangular (Grave)</option>
                <option value="noise">Ruído / Percussão</option>
            </select>
        </div>

        <!-- Tom / Pitch -->
        <div class="control-item">
            <label for="pitch">Tom / Altura (Pitch): <span id="pitchVal">1.0</span></label>
            <input type="range" id="pitch" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateLabels()">
        </div>

        <!-- Velocidade -->
        <div class="control-item">
            <label for="speed">Velocidade / Ritmo: <span id="speedVal">1.0x</span></label>
            <input type="range" id="speed" min="0.5" max="2.5" step="0.1" value="1.0" oninput="updateLabels()">
        </div>
    </div>

    <button class="btn-play" id="btnPlay" onclick="playAudio()">▶ REPRODUZIR SOM</button>

    <div class="visualizer" id="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
</div>

<script>
    let currentMode = 'voice'; // 'voice' ou 'synth'
    const synth = window.speechSynthesis;
    let voices = [];

    // Carrega vozes humanas disponíveis no navegador/sistema
    function loadVoices() {
        voices = synth.getVoices().filter(voice => voice.lang.includes('pt') || voice.lang.includes('en'));
        const voiceList = document.getElementById('voiceList');
        voiceList.innerHTML = '';
        
        voices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = `${voice.name} (${voice.lang})`;
            if (voice.default || voice.lang.includes('pt-BR')) {
                option.selected = true;
            }
            voiceList.appendChild(option);
        });
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }
    loadVoices();

    function setMode(mode) {
        currentMode = mode;
        const btnVoice = document.getElementById('btnModeVoice');
        const btnSynth = document.getElementById('btnModeSynth');
        const voiceGroup = document.getElementById('voiceSelectGroup');
        const synthGroup = document.getElementById('synthWaveGroup');
        const btnPlay = document.getElementById('btnPlay');

        if (mode === 'voice') {
            btnVoice.className = 'mode-btn active-voice';
            btnSynth.className = 'mode-btn';
            voiceGroup.style.display = 'flex';
            synthGroup.style.display = 'none';
            btnPlay.style.background = 'var(--voice-color)';
        } else {
            btnVoice.className = 'mode-btn';
            btnSynth.className = 'mode-btn active-synth';
            voiceGroup.style.display = 'none';
            synthGroup.style.display = 'flex';
            btnPlay.style.background = 'var(--accent-color)';
        }
        updateLabels();
    }

    function updateLabels() {
        const pitch = document.getElementById('pitch').value;
        const speed = document.getElementById('speed').value;

        document.getElementById('pitchVal').innerText = pitch;
        document.getElementById('speedVal').innerText = speed + 'x';
    }

    function animateVisualizer() {
        const bars = document.querySelectorAll('.bar');
        const interval = setInterval(() => {
            bars.forEach(bar => {
                bar.style.height = (Math.floor(Math.random() * 85) + 15) + '%';
            });
        }, 80);

        setTimeout(() => {
            clearInterval(interval);
            bars.forEach(bar => bar.style.height = '10%');
        }, 1200);
    }

    function playAudio() {
        const text = document.getElementById('textInput').value.trim();
        if (!text) return;

        animateVisualizer();

        if (currentMode === 'voice') {
            // Reprodução de Voz Humana Nativa
            synth.cancel(); // Para fala anterior se houver

            const utterThis = new SpeechSynthesisUtterance(text);
            const selectedVoiceIndex = document.getElementById('voiceList').value;
            
            if (voices[selectedVoiceIndex]) {
                utterThis.voice = voices[selectedVoiceIndex];
            }

            utterThis.pitch = parseFloat(document.getElementById('pitch').value);
            utterThis.rate = parseFloat(document.getElementById('speed').value);

            synth.speak(utterThis);
        } else {
            // Reprodução Sintetizada Web Audio API
            playSynthSound(text);
        }
    }

    // Sintetizador de Som por Consoante/Efeito
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSynthSound(text) {
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const words = text.toLowerCase().split(/\s+/);
        const waveType = document.getElementById('waveType').value;
        const pitchFactor = parseFloat(document.getElementById('pitch').value);
        const speedFactor = parseFloat(document.getElementById('speed').value);

        const baseInterval = 300 / speedFactor;
        let startTime = audioCtx.currentTime;

        words.forEach((word, index) => {
            const time = startTime + (index * (baseInterval / 1000));
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            let freq = 300 * pitchFactor;
            if (word.includes('t') || word.includes('k')) freq *= 1.4;
            if (word.includes('b') || word.includes('m')) freq *= 0.6;

            osc.type = waveType;
            osc.frequency.setValueAtTime(freq, time);

            gain.gain.setValueAtTime(0.3, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(time);
            osc.stop(time + 0.15);
        });
    }
</script>

</body>
</html>
