<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Urna Eletrônica Brasil - Full Size</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .urna-container {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      background: #d8d8d8;
      border: 4px solid #555;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
      position: relative;
    }

    .topo-urna {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #999;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }

    .topo-urna h2 {
      margin: 0;
      font-size: 20px;
      color: #111;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .botoes-topo {
      display: flex;
      gap: 8px;
    }

    .btn-top {
      background: #0056b3;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-top:active {
      background: #003d80;
    }

    .tela-lcd {
      background-color: #8cb88b;
      border: 4px solid #486148;
      border-radius: 8px;
      flex: 1;
      min-height: 280px;
      padding: 16px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
      color: #041c04;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .lcd-header {
      font-size: 15px;
      text-transform: uppercase;
      border-bottom: 2px solid #486148;
      padding-bottom: 4px;
    }

    .lcd-body {
      display: flex;
      flex: 1;
      margin-top: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .lcd-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cargo-titulo {
      font-size: 22px;
      text-transform: uppercase;
      color: #000;
    }

    .caixas-numero {
      display: flex;
      gap: 8px;
      margin: 10px 0;
    }

    .digito-box {
      width: 40px;
      height: 50px;
      border: 3px solid #041c04;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      background: rgba(255,255,255,0.3);
    }

    .digito-box.pisca {
      animation: piscar 0.8s infinite;
    }

    @keyframes piscar {
      0%, 100% { border-color: #041c04; }
      50% { border-color: transparent; }
    }

    .dado-candidato {
      font-size: 18px;
      line-height: 1.4;
    }

    .lcd-foto-container {
      width: 170px;
      height: 200px;
      border: 3px solid #041c04;
      background: #a2c8a2;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .lcd-foto-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-label {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 11px;
      text-align: center;
      padding: 3px 0;
      text-transform: uppercase;
    }

    .lcd-instrucoes {
      border-top: 2px solid #486148;
      padding-top: 8px;
      font-size: 13px;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .tela-mensagem-status {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      font-size: 48px;
      letter-spacing: 2px;
      color: #000;
      text-align: center;
      font-weight: bold;
    }

    .teclado {
      background: #1a1a1a;
      padding: 16px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.8);
    }

    .teclado-numerico {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .btn-num {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 16px 0;
      font-size: 26px;
      box-shadow: 0 4px 0 #000;
      cursor: pointer;
      text-align: center;
    }

    .btn-num:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #000;
    }

    .teclado-linha-zero {
      display: flex;
      justify-content: center;
    }
    .teclado-linha-zero .btn-num {
      width: 32%;
    }

    .teclado-acoes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 6px;
    }

    .btn-acao {
      border: none;
      border-radius: 6px;
      padding: 16px 4px;
      font-size: 14px;
      text-transform: uppercase;
      box-shadow: 0 4px 0 rgba(0,0,0,0.6);
      cursor: pointer;
      color: #000;
    }

    .btn-acao:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.6);
    }

    .btn-branco { background-color: #ffffff; }
    .btn-correge { background-color: #ff5500; }
    .btn-confirma { background-color: #00aa00; font-size: 15px; }

    /* Modal Maquininha Recibo */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-card {
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 8px;
      padding: 16px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      color: #222;
      display: flex;
      flex-direction: column;
    }

    .papel-termico {
      background: #fffef0;
      border: 1px dashed #777;
      padding: 15px;
      font-family: 'Courier New', Courier, monospace !important;
      font-size: 12px;
      font-weight: normal !important;
      color: #000;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
      white-space: pre-wrap;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .papel-termico * {
      font-family: 'Courier New', Courier, monospace !important;
      font-weight: normal !important;
    }

    .papel-header {
      text-align: center;
      font-weight: bold !important;
      border-bottom: 1px dashed #000;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .btn-modal {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }

    .btn-fechar {
      background: #6c757d;
    }
  </style>
</head>
<body>

  <!-- Elemento de Áudio apontando diretamente para o arquivo local confirma_urna.mp3 -->
  <audio id="somConfirma" src="confirma_urna.mp3" preload="auto"></audio>

  <div class="urna-container">
    <div class="topo-urna">
      <h2>Justiça Eleitoral</h2>
      <div class="botoes-topo">
        <button class="btn-top" onclick="alternarTelaCheia()">Tela Cheia</button>
        <button class="btn-top" style="background:#28a745" onclick="abrirVotosParciais()">Votos Parciais</button>
      </div>
    </div>

    <div class="tela-lcd" id="telaLCD"></div>

    <div class="teclado">
      <div class="teclado-numerico">
        <button class="btn-num" onclick="digitar('1')">1</button>
        <button class="btn-num" onclick="digitar('2')">2</button>
        <button class="btn-num" onclick="digitar('3')">3</button>
        <button class="btn-num" onclick="digitar('4')">4</button>
        <button class="btn-num" onclick="digitar('5')">5</button>
        <button class="btn-num" onclick="digitar('6')">6</button>
        <button class="btn-num" onclick="digitar('7')">7</button>
        <button class="btn-num" onclick="digitar('8')">8</button>
        <button class="btn-num" onclick="digitar('9')">9</button>
      </div>
      <div class="teclado-linha-zero">
        <button class="btn-num" onclick="digitar('0')">0</button>
      </div>

      <div class="teclado-acoes">
        <button class="btn-action btn-branco btn-acao" onclick="votarBranco()">BRANCO</button>
        <button class="btn-action btn-correge btn-acao" onclick="corrigir()">CORRIGE</button>
        <button class="btn-action btn-confirma btn-acao" onclick="confirmar()">CONFIRMA</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalParciais">
    <div class="modal-card">
      <div id="reciboConteudo" class="papel-termico"></div>
      <button class="btn-modal btn-fechar" onclick="fecharModalParciais()">FECHAR</button>
    </div>
  </div>

  <script>
    // Função para gerar Badge SVG/DataURI diretamente dentro das linhas do código
    function gerarFotoBadgeCodigo(numero, nome, partido, corFundo) {
      const iniciais = nome.split(' ').map(n => n[0]).join('').substring(0, 2);
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="170" height="200" viewBox="0 0 170 200">
          <rect width="170" height="200" fill="${corFundo}"/>
          <rect x="5" y="5" width="160" height="190" fill="none" stroke="#ffffff" stroke-width="3"/>
          <circle cx="85" cy="85" r="45" fill="#ffffff" opacity="0.2"/>
          <text x="85" y="40" font-family="Arial" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">${numero}</text>
          <text x="85" y="100" font-family="Arial" font-weight="bold" font-size="38" fill="#facc15" text-anchor="middle">${iniciais}</text>
          <text x="85" y="160" font-family="Arial" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle">${partido}</text>
        </svg>
      `.trim();
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    // Lista de candidatos com as fotos/GIFs embutidos diretamente dentro do código
    // Para usar uma foto do celular, substitua a string 'foto' pelo código DataURI/Base64 da sua imagem
    const candidatos = [
      { numero: '27', nome: 'CLARIANA BARAO', partido: 'DC', foto: gerarFotoBadgeCodigo('27', 'CLARIANA BARAO', 'DC', '#1e3a8a') },
      { numero: '21', nome: 'EDMILSON COSTA', partido: 'PCB', foto: gerarFotoBadgeCodigo('21', 'EDMILSON COSTA', 'PCB', '#991b1b') },
      { numero: '70', nome: 'AUGUSTO CURY', partido: 'AVANTE', foto: gerarFotoBadgeCodigo('70', 'AUGUSTO CURY', 'AVANTE', '#065f46') },
      { numero: '22', nome: 'FLAVIO BOLSONARO', partido: 'PL', foto: gerarFotoBadgeCodigo('22', 'FLAVIO BOLSONARO', 'PL', '#1e40af') },
      { numero: '16', nome: 'HERTZ DIAS', partido: 'PSTU', foto: gerarFotoBadgeCodigo('16', 'HERTZ DIAS', 'PSTU', '#b91c1c') },
      { numero: '13', nome: 'LULA', partido: 'PT', foto: gerarFotoBadgeCodigo('13', 'LULA', 'PT', '#dc2626') },
      { numero: '14', nome: 'RENAN SANTOS', partido: 'MISSÃO', foto: gerarFotoBadgeCodigo('14', 'RENAN SANTOS', 'MISSÃO', '#4338ca') },
      { numero: '55', nome: 'RONALDO CAIADO', partido: 'PSD', foto: gerarFotoBadgeCodigo('55', 'RONALDO CAIADO', 'PSD', '#047857') },
      { numero: '29', nome: 'RUI COSTA PIMENTA', partido: 'PCO', foto: gerarFotoBadgeCodigo('29', 'RUI COSTA PIMENTA', 'PCO', '#9f1239') },
      { numero: '80', nome: 'SAMARA', partido: 'UP', foto: gerarFotoBadgeCodigo('80', 'SAMARA', 'UP', '#6b21a8') },
      { numero: '35', nome: 'WILSON GRASSI', partido: 'DEMOCRATA', foto: gerarFotoBadgeCodigo('35', 'WILSON GRASSI', 'DEMOCRATA', '#15803d') },
      { numero: '30', nome: 'ZEMA', partido: 'NOVO', foto: gerarFotoBadgeCodigo('30', 'ZEMA', 'NOVO', '#c2410c') }
    ];

    const ETAPA = { titulo: 'PRESIDENTE', digitos: 2 };

    let numeroDigitado = '';
    let votoBranco = false;
    let estadoTela = 'VOTACAO';

    let votos = JSON.parse(localStorage.getItem('urna_votos_persistentes')) || [];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function tocarBeep(freq = 1300, duracao = 0.05) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duracao);
    }

    // Toca estritamente o arquivo confirma_urna.mp3
    function tocarSomFimUrna() {
      const som = document.getElementById('somConfirma');
      if (som) {
        som.currentTime = 0;
        som.play().catch(e => {
          console.log("Não foi possível reproduzir confirma_urna.mp3:", e);
        });
      }
    }

    function atualizarTela() {
      const lcd = document.getElementById('telaLCD');

      if (estadoTela === 'CONFIRMADO') {
        lcd.innerHTML = `<div class="tela-mensagem-status">VOTO CONFIRMADO</div>`;
        return;
      }

      if (estadoTela === 'FIM') {
        lcd.innerHTML = `<div class="tela-mensagem-status">FIM</div>`;
        return;
      }

      const cand = candidatos.find(c => c.numero === numeroDigitado);

      let digitosHTML = '';
      for (let i = 0; i < ETAPA.digitos; i++) {
        const char = numeroDigitado[i] || '';
        const pisca = (i === numeroDigitado.length && !votoBranco) ? 'pisca' : '';
        digitosHTML += `<div class="digito-box ${pisca}">${char}</div>`;
      }

      let conteudoBody = '';
      if (votoBranco) {
        conteudoBody = `
          <div class="lcd-info">
            <div class="cargo-titulo">SEU VOTO VAI PARA</div>
            <div style="font-size:24px; margin-top:20px;">VOTO EM BRANCO</div>
          </div>
        `;
      } else if (cand) {
        conteudoBody = `
          <div class="lcd-info">
            <div class="cargo-titulo">${ETAPA.titulo}</div>
            <div class="caixas-numero">${digitosHTML}</div>
            <div class="dado-candidato">
              Nome: <b>${cand.nome}</b><br>
              Partido: <b>${cand.partido}</b>
            </div>
          </div>
          <div class="lcd-foto-container">
            <img src="${cand.foto}" alt="${cand.nome}">
            <div class="badge-label">${cand.partido} - ${cand.numero}</div>
          </div>
        `;
      } else if (numeroDigitado.length === ETAPA.digitos) {
        conteudoBody = `
          <div class="lcd-info">
            <div class="cargo-titulo">${ETAPA.titulo}</div>
            <div class="caixas-numero">${digitosHTML}</div>
            <div class="dado-candidato" style="margin-top:10px; color:#600;">
              <b>NÚMERO ERRADO</b><br>
              <b>VOTO NULO</b>
            </div>
          </div>
        `;
      } else {
        conteudoBody = `
          <div class="lcd-info">
            <div class="cargo-titulo">${ETAPA.titulo}</div>
            <div class="caixas-numero">${digitosHTML}</div>
          </div>
        `;
      }

      lcd.innerHTML = `
        <div class="lcd-header">Justiça Eleitoral</div>
        <div class="lcd-body">${conteudoBody}</div>
        <div class="lcd-instrucoes">
          Aperte:<br>
          <b>VERDE</b> para CONFIRMAR<br>
          <b>LARANJA</b> para CORRIGIR
        </div>
      `;
    }

    function digitar(n) {
      if (estadoTela !== 'VOTACAO' || votoBranco) return;
      if (numeroDigitado.length < ETAPA.digitos) {
        tocarBeep();
        numeroDigitado += n;
        atualizarTela();
      }
    }

    function votarBranco() {
      if (estadoTela !== 'VOTACAO') return;
      if (numeroDigitado === '') {
        tocarBeep();
        votoBranco = true;
        atualizarTela();
      }
    }

    function corrigir() {
      if (estadoTela !== 'VOTACAO') return;
      tocarBeep(1000);
      numeroDigitado = '';
      votoBranco = false;
      atualizarTela();
    }

    function confirmar() {
      if (estadoTela !== 'VOTACAO') return;

      let votoRegistrado = null;

      if (votoBranco) {
        votoRegistrado = { numero: 'BRANCO', tipo: 'BRANCO' };
      } else if (numeroDigitado.length === ETAPA.digitos) {
        const cand = candidatos.find(c => c.numero === numeroDigitado);
        if (cand) {
          votoRegistrado = { numero: cand.numero, nome: cand.nome, partido: cand.partido, tipo: 'VALIDO' };
        } else {
          votoRegistrado = { numero: numeroDigitado, tipo: 'NULO' };
        }
      }

      if (votoRegistrado) {
        votos.push(votoRegistrado);
        localStorage.setItem('urna_votos_persistentes', JSON.stringify(votos));

        estadoTela = 'CONFIRMADO';
        atualizarTela();

        setTimeout(() => {
          estadoTela = 'FIM';
          tocarSomFimUrna();
          atualizarTela();

          setTimeout(() => {
            estadoTela = 'VOTACAO';
            numeroDigitado = '';
            votoBranco = false;
            atualizarTela();
          }, 3000);
        }, 1800);
      }
    }

    function obterDataHora() {
      const d = new Date();
      return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR');
    }

    function abrirVotosParciais() {
      const modal = document.getElementById('modalParciais');
      const recibo = document.getElementById('reciboConteudo');

      let contagem = {};
      let totalValidos = 0;
      let brancos = 0;
      let nulos = 0;

      candidatos.forEach(c => { contagem[c.numero] = 0; });

      votos.forEach(v => {
        if (v.tipo === 'VALIDO') {
          contagem[v.numero] = (contagem[v.numero] || 0) + 1;
          totalValidos++;
        } else if (v.tipo === 'BRANCO') {
          brancos++;
        } else if (v.tipo === 'NULO') {
          nulos++;
        }
      });

      let listaDetalhada = '';
      candidatos.forEach(c => {
        const qtd = contagem[c.numero] || 0;
        const pct = totalValidos > 0 ? ((qtd / totalValidos) * 100).toFixed(1) : '0.0';
        listaDetalhada += `${c.numero.padEnd(3, ' ')} ${c.nome.substring(0, 12).padEnd(12, ' ')} : ${String(qtd).padStart(3, '0')} (${pct}%)\n`;
      });

      recibo.innerHTML = `
<div class="papel-header">
JUSTIÇA ELEITORAL
RELATÓRIO PARCIAL DE VOTAÇÃO
</div>
DATA/HORA: ${obterDataHora()}
URNA ID  : FULL-SIZE-99482
--------------------------------
Nº  NOME         : QTD  (%)
--------------------------------
${listaDetalhada}--------------------------------
VOTOS EM BRANCO   : ${String(brancos).padStart(3, '0')}
VOTOS NULOS       : ${String(nulos).padStart(3, '0')}
TOTAL COMPUTADO   : ${String(votos.length).padStart(3, '0')}
================================
`;

      modal.style.display = 'flex';
    }

    function fecharModalParciais() {
      document.getElementById('modalParciais').style.display = 'none';
    }

    function alternarTelaCheia() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    atualizarTela();
  </script>
</body>
</html>
